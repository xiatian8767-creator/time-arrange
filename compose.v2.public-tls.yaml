services:
  public-admin-proxy:
    image: xingke-download:2.1.0-beta.1
    restart: unless-stopped
    ports:
      - "0.0.0.0:8443:8443"
    volumes:
      - ./backend/public-ip-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [api]
    networks: [starorbit-ingress]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null --no-check-certificate https://127.0.0.1:8443/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
