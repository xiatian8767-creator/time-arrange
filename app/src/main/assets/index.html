<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fc">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'">
<title>星课表</title><link rel="stylesheet" href="style.css">
</head><body>
<main>
<header class="top"><div><div class="eyebrow">属于你的每一周</div><h1><span class="brand-star">★</span> 星课表</h1></div><button class="icon-button" id="settings" aria-label="设置">⚙</button></header>
<section class="now-card"><div class="now-star">★</div><div class="now-copy"><div id="now-label" class="now-label"></div><div id="now-detail"></div></div><span class="offline">离线可用</span></section>
<nav class="week-nav" aria-label="切换周"><button id="prev" aria-label="上一周">‹</button><div><strong id="week-title"></strong><small id="week-subtitle"></small></div><button id="next" aria-label="下一周">›</button><button id="today" class="today-button">今天</button></nav>
<section class="schedule-shell"><div id="week-head" class="week-head"></div><div id="schedule" class="schedule"><div id="time-axis"></div><div id="grid" class="grid"></div></div></section>
<div class="legend"><span><i class="dot blue"></i>904</span><span><i class="dot pink"></i>905</span><span class="legend-hint">★ 当前时间 · 点空白处添课</span></div>
<footer><button id="add" class="primary">＋ 添加课程</button><button id="times" class="secondary">作息时间</button></footer>
</main>
<div id="modal" class="modal" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="sheet-head"><h2 id="dialog-title"></h2><button id="close" class="icon-button" aria-label="关闭">×</button></div><div id="dialog-body"></div></section></div>
<div id="toast" role="status" class="toast" hidden></div>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<script src="core.js"></script><script src="app.js"></script>
</body></html>
