<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'">
  <title>星课表</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="schedule-page" class="page active" aria-labelledby="nav-schedule">
    <section class="now-card">
      <div class="now-star">★</div>
      <div class="now-copy"><div id="now-label" class="now-label"></div><div id="now-detail"></div></div>
      <span class="offline">离线可用</span>
    </section>

    <nav class="week-nav" aria-label="切换周">
      <button id="prev" aria-label="上一周">‹</button>
      <div><strong id="week-title"></strong><small id="week-subtitle"></small></div>
      <button id="next" aria-label="下一周">›</button>
      <button id="today" class="today-button">今天</button>
    </nav>

    <div id="schedule-toggle" class="schedule-toggle" role="group" aria-label="选择课表" hidden>
      <span class="schedule-thumb" aria-hidden="true"></span>
      <button id="schedule-mine" class="selected" aria-pressed="true">我的课表</button>
      <button id="schedule-partner" aria-pressed="false">搭子课表</button>
    </div>
    <div class="page-actions">
      <button id="partner-manage" class="secondary">搭子课表</button>
      <button id="add" class="primary">＋ 添加课程</button>
      <button id="times" class="secondary">作息时间</button>
    </div>

    <section class="schedule-shell">
      <div id="week-head" class="week-head"></div>
      <div id="schedule" class="schedule"><div id="time-axis"></div><div id="grid" class="grid"></div></div>
    </section>
    <div class="legend"><span class="legend-hint">★ 当前时间 · 点空白处添加自己的课程</span></div>
  </section>

  <section id="todo-page" class="page" hidden aria-labelledby="nav-todos">
    <section class="todo-hero">
      <div><div class="section-kicker">事务待办</div><h2>今天要完成什么？</h2><p id="todo-subtitle"></p></div>
      <button id="add-todo" class="round-add" aria-label="新增待办">＋</button>
    </section>
    <section class="todo-summary" aria-label="待办概况">
      <div><strong id="todo-pending-count">0</strong><span>待完成</span></div>
      <div><strong id="todo-today-count">0</strong><span>今天到期</span></div>
      <div><strong id="todo-done-count">0</strong><span>已完成</span></div>
    </section>
    <nav id="todo-filters" class="todo-filters" aria-label="筛选待办">
      <button data-filter="pending" class="selected">待完成</button>
      <button data-filter="today">今天</button>
      <button data-filter="all">全部</button>
      <button data-filter="completed">已完成</button>
    </nav>
    <section id="todo-list" class="todo-list" aria-live="polite"></section>
    <p id="notification-note" class="notification-note"></p>
    <div class="reminder-actions"><button id="notification-settings" class="secondary" hidden>开启系统通知</button><button id="exact-settings" class="secondary" hidden>允许准时提醒</button></div>
  </section>
</main>

<nav class="bottom-nav" aria-label="主要页面">
  <button id="nav-schedule" class="selected" aria-current="page"><span>▦</span>课表</button>
  <button id="nav-todos"><span>✓</span>事务待办</button>
  <button id="settings" aria-label="设置与备份"><span>⚙</span>设置</button>
</nav>

<div id="modal" class="modal" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="sheet-head"><h2 id="dialog-title"></h2><button id="close" class="icon-button" aria-label="关闭">×</button></div><div id="dialog-body"></div></section></div>
<div id="toast" role="status" class="toast" hidden></div>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<input id="partner-file" type="file" accept="application/json,.json" hidden>
<script src="core.js"></script><script src="app.js"></script>
</body>
</html>
