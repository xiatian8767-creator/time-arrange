<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>待办提醒</title><link rel="stylesheet" href="alarm.css"></head><body>
<main><header><time id="clock"></time><p id="date"></p></header><section class="glass" aria-label="待办闹钟"><div class="art"><div class="orbit"></div><div class="plush"></div><i>✦</i></div><span class="eyebrow">STAR ORBIT · 待办提醒</span><h1>到时间了</h1><div id="tasks" aria-live="polite"></div><div class="slide" id="slide"><span>向右滑动，关闭响铃</span><button id="handle" aria-label="向右拖动关闭闹钟">›</button></div><p class="caption">关闭响铃，不会完成待办</p></section><footer><button id="snooze"><span>◷</span>稍后 5 分钟</button><button id="stop"><span>□</span>停止响铃</button></footer></main><script src="alarm.js"></script></body></html>
