<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>问题反馈 · Star Orbit</title><link rel="stylesheet" href="/feedback/style.css"></head>
<body><header><a class="brand" href="http://startimetable.xyz/">✦ <span>Star Orbit</span></a><a href="http://startimetable.xyz/">返回发布页 ↗</a></header><main><section class="intro"><span class="orbit" aria-hidden="true">✦</span><p class="eyebrow">我们在听</p><h1>说说你遇到的问题。</h1><p>哪里没用顺手，或有什么建议，都可以告诉我们。</p></section>
<section class="card" id="form-card"><form id="feedback-form"><label for="description">问题描述 <span>必填</span></label><textarea id="description" name="description" minlength="1" maxlength="4000" rows="6" required placeholder="发生了什么？你是怎样操作的？如果方便，也请告诉我们手机型号和应用版本。"></textarea><div class="counter"><span>请勿填写密码或 API Key。</span><span id="count">0 / 4000</span></div>
<label for="photos">相关图片 <span>选填 · 最多 3 张</span></label><div class="upload"><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><p>截图或照片都可以，上传前会自动压缩。</p></div><div id="previews" class="previews"></div>
<label for="contact">联系方式 <span>必填</span></label><input id="contact" name="contact" maxlength="200" required autocomplete="off" placeholder="邮箱、手机号或微信号"><p class="privacy">联系方式和图片仅用于处理反馈，不会公开展示。</p>
<div class="trap" aria-hidden="true"><label for="website">网站<input id="website" tabindex="-1" autocomplete="off"></label></div><p id="notice" role="status" aria-live="polite"></p><button class="submit" id="submit" type="submit">提交反馈 <span>↗</span></button></form></section>
<section class="card success" id="success" hidden><span class="success-icon">✓</span><h2>反馈收到了。</h2><p>我们会查看你的反馈，需要进一步了解时，会通过你留下的联系方式联系你。</p><p class="receipt">反馈编号 <strong id="receipt"></strong></p><button id="again" type="button">再反馈一个问题</button><a href="http://startimetable.xyz/">返回发布页</a></section></main><footer>Star Orbit · 谢谢你帮它变得更好。</footer><script src="/feedback/app.js"></script></body></html>
