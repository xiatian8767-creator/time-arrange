server {
    listen 8443 ssl;
    server_name 8.154.43.154;
    ssl_certificate /etc/letsencrypt/live/8.154.43.154/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.154.43.154/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $starorbit_upstream starorbit-backend:8000;
    location = / { return 302 /admin/; }
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location = /feedback { return 302 /feedback/; }
    location /feedback/ {
        proxy_pass http://$starorbit_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /admin { return 302 /admin/; }
    location /updates/ {
        proxy_pass http://$starorbit_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /downloads/ {
        alias /srv/downloads/;
        types { application/vnd.android.package-archive apk; }
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600";
    }
    location /admin/ {
        proxy_pass http://$starorbit_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
