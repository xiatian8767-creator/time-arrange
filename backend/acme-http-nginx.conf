map $uri $orbit_page_cache_control {
    default "";
    / "no-store";
    /index.html "no-store";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $orbit_page_cache_control always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /feedback { return 302 https://8.154.43.154:8443/feedback/; }
    location /feedback/ { return 302 https://8.154.43.154:8443/feedback/; }
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location /downloads/ {
        types { application/vnd.android.package-archive apk; }
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
