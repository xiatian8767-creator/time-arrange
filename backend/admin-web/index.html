<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Orbit · 运营管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#26324b;font:15px system-ui,sans-serif}main{max-width:1100px;margin:40px auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}h1{font-size:26px}small,p{color:#6b7892}section{background:white;padding:24px;border-radius:20px;margin:16px 0;box-shadow:0 8px 30px #26324b08}#login{max-width:420px;margin:70px auto}label{display:block;margin:15px 0}input,textarea,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #d9dfec}input,textarea{width:100%;margin-top:8px}textarea{resize:vertical}button{cursor:pointer;background:#596fd5;color:#fff;border:0}button:disabled{opacity:.5}form.search,.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}form.search input{flex:1}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:15px 10px;border-bottom:1px solid #edf0f5;word-break:break-word}.table{overflow:auto}#notice{min-height:24px;color:#aa3657}dialog{border:0;border-radius:20px;max-width:440px;width:90%;padding:25px}dialog::backdrop{background:#18254066}.actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}.tabs{display:flex;gap:12px}.tabs button{background:#e5e9f3;color:#425372}.tabs button[aria-selected=true]{background:#596fd5;color:white}.badge{display:inline-block;padding:5px 9px;background:#edf1f9;border-radius:7px;white-space:nowrap;font-size:13px}.badge.processing{background:#fff2da;color:#956721}.badge.completed{background:#e7f4ed;color:#377453}#feedback-detail{max-width:720px;max-height:88vh;overflow:auto}.detail-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;color:#26324b}.feedback-images{display:flex;gap:12px;flex-wrap:wrap}.feedback-images img{width:140px;height:130px;object-fit:contain;background:#f5f6fa;border-radius:10px}.feedback-preview{max-width:300px;min-width:170px}.toolbar label{margin:0}.counts{font-size:14px;color:#6b7892}#feedback-save-note{color:#aa3657}button.secondary{background:#e8ecf4;color:#425372}[hidden]{display:none!important}@media(max-width:600px){main{margin:12px auto;padding:14px}section{padding:18px}header{margin-bottom:15px}td,th{padding:12px 8px}dialog{padding:20px}.feedback-images img{width:105px;height:105px}}
:root{color-scheme:light;--navy:#1c2945;--gold:#c4a56b;--muted:#8490a2}body{background:#f6f5f1;color:var(--navy);font-size:14px}main{max-width:1500px;padding:30px 36px;margin:0 auto}header{margin:0 0 20px;padding-bottom:22px;border-bottom:1px solid #e4e6eb}h1{font:26px Georgia,serif;letter-spacing:-.7px;margin:0 0 7px}h1:first-letter{color:var(--gold)}small,p{color:var(--muted)}button{background:var(--navy);border-radius:9px;font-size:13px}button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}input,select,textarea{background:#fafaf8;border-color:#e2e5eb;color:var(--navy);border-radius:9px}input:focus,textarea:focus,select:focus{outline:2px solid #c4a56b77;outline-offset:1px}section{box-shadow:none;border:1px solid #e4e6eb;border-radius:16px;padding:26px;margin:0}#login{max-width:900px;min-height:440px;display:grid;grid-template-columns:1fr 1fr;padding:0;overflow:hidden;margin:50px auto}.login-brand{background:var(--navy);color:white;display:flex;flex-direction:column;justify-content:center;padding:46px;position:relative;overflow:hidden}.login-brand:before,.login-brand:after{content:"";position:absolute;width:370px;height:140px;border:1px solid #c4a56b55;border-radius:50%;transform:rotate(-30deg);left:-15px;top:80px}.login-brand:after{transform:rotate(32deg);top:200px}.login-brand strong{font:36px Georgia,serif;position:relative}.login-brand span{color:#c4a56b;margin-top:18px;letter-spacing:4px;font-size:11px}.login-form-wrap{padding:42px}.login-form-wrap h2{font-size:23px;letter-spacing:-.5px;margin-bottom:30px}#login-form>button{width:100%;margin-top:20px;padding:14px}#workspace{display:grid;grid-template-columns:185px minmax(0,1fr);gap:30px;min-height:70vh}.tabs{grid-row:1 / 3;display:flex;flex-direction:column;align-items:stretch;padding-top:4px}.tabs button{text-align:left;background:none;color:#788397;padding:15px 18px;font-weight:500}.tabs button[aria-selected=true]{background:var(--navy);color:white}.workspace-heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px}.workspace-heading h2{margin:0;font-size:22px}.workspace-heading span{font-size:11px;color:var(--muted)}form.search{margin-bottom:24px}form.search input{margin:0;min-width:160px}#notice{margin:5px 0 14px;font-size:12px;min-height:20px}th{color:#8a95a6;font-size:11px;font-weight:500;white-space:nowrap}td{font-size:12px;border-color:#eef0f4;padding:19px 10px}td button{background:#f2f4f7;color:#52617b;padding:9px 11px;font-size:11px}.actions button.secondary,.actions>button:not(:first-child),#logout{background:white;color:#657187;border:1px solid #e4e6eb}.actions{justify-content:flex-end}.toolbar{margin-bottom:24px}.toolbar label{font-size:12px;color:#8993a3}.toolbar select{margin-left:12px;padding:9px}.counts{font-size:11px}.badge{font-size:11px;border-radius:20px;color:#67758e;background:#eff2f7}.badge.processing{color:#927842;background:#f4ecda}.badge.completed{color:#477760;background:#eaf2ed}.feedback-workbench{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}.feedback-preview{min-width:130px;max-width:240px;line-height:1.7}.feedback-images img{width:88px;height:85px}.detail-text{font-size:13px;line-height:1.9}.detail-text:empty{display:none}#feedback-detail{background:#f8f8f5;border:1px solid #e4e6eb;border-radius:14px}#feedback-detail h2{font-size:18px}#feedback-detail h3{font-size:11px;color:#8c95a4;font-weight:500;margin-top:25px}#feedback-meta,#feedback-handler{font-size:10px;line-height:1.8}#feedback-update label{font-size:12px}#feedback-note{font-size:12px}#feedback-update .actions{justify-content:flex-start}#feedback-update button{font-size:11px}dialog{color:var(--navy);background:#f6f5f1;box-shadow:0 20px 80px #1c29451a}dialog::backdrop{background:#1c294577;backdrop-filter:blur(4px)}
#feedback-detail[open]{position:fixed;inset:0;width:min(720px,92vw);max-height:86vh;margin:auto;padding:28px}
@media(max-width:1100px){.feedback-workbench:has(dialog[open]){grid-template-columns:minmax(0,1fr)}#feedback-detail{position:fixed;width:min(90%,600px);max-height:88vh;padding:25px}}
@media(max-width:700px){main{padding:20px 16px}#workspace{grid-template-columns:minmax(0,1fr);gap:18px}.tabs{grid-row:auto;flex-direction:row;gap:8px}.tabs button{flex:1;text-align:center}section{padding:18px}.workspace-heading span{display:none}#login{grid-template-columns:1fr;margin-top:24px}.login-brand{padding:34px;min-height:140px}.login-brand strong{font-size:30px}.login-form-wrap{padding:28px}.toolbar{gap:10px}.counts{flex-basis:100%}header{padding-bottom:18px}h1{font-size:24px}.workspace-heading h2{font-size:20px}}
</style></head><body><main><header><div><h1>✦ Star Orbit</h1><small>运营管理</small></div><button id="logout" hidden>退出登录</button></header><p id="notice" role="status"></p><p id="auth-loading" role="status">正在进入工作台…</p><section id="login" hidden><div class="login-brand"><strong>Star Orbit</strong><span>运营工作台</span></div><div class="login-form-wrap"><h2>管理员登录</h2><form id="login-form"><label>用户名<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button>登录</button></form></div></section>
<div id="workspace" hidden><nav class="tabs" aria-label="管理栏目"><a href="/admin/assistant/" style="padding:15px 18px;color:#788397;text-decoration:none">星小助系统</a><button id="users-tab" aria-selected="true">用户管理</button><button id="feedback-tab" aria-selected="false">用户反馈</button><a href="/admin/codes/" style="padding:15px 18px;color:#788397;text-decoration:none">星币兑换码</a></nav><section id="dashboard" hidden><div class="workspace-heading"><h2>用户管理</h2><span>账号与信息</span></div><form id="search" class="search"><input id="query" placeholder="搜索用户名、昵称或用户 ID" maxlength="80" aria-label="搜索用户"><button>查询</button></form><div class="table"><table><thead><tr><th>用户名</th><th>昵称</th><th>用户 ID</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button id="prev">上一页</button><button id="next">下一页</button></div></section>
<section id="feedback-dashboard" hidden><div class="workspace-heading"><h2>用户反馈</h2><span>倾听每一次使用体验</span></div><div class="toolbar"><label>处理状态<select id="feedback-filter"><option value="">全部反馈</option><option value="pending">待处理</option><option value="processing">处理中</option><option value="completed">处理完成</option></select></label><button id="feedback-refresh">刷新</button><span class="counts" id="feedback-counts"></span></div><div class="feedback-workbench"><div><div class="table"><table><thead><tr><th>提交时间</th><th>问题描述</th><th>联系方式</th><th>状态</th><th>操作</th></tr></thead><tbody id="feedback-rows"></tbody></table></div><div class="actions"><button id="feedback-prev">上一页</button><button id="feedback-next">下一页</button></div></div><dialog id="feedback-detail"><h2>用户反馈</h2><p id="feedback-meta"></p><h3>问题描述</h3><p class="detail-text" id="feedback-description"></p><h3>联系方式</h3><p class="detail-text" id="feedback-contact"></p><div class="feedback-images" id="feedback-images"></div><form id="feedback-update"><label>处理状态<select id="feedback-state"><option value="pending">待处理</option><option value="processing">处理中</option><option value="completed">处理完成</option></select></label><label>处理备注<textarea id="feedback-note" maxlength="2000" rows="3" placeholder="内部备注，仅管理员可见"></textarea></label><p id="feedback-handler"></p><p id="feedback-save-note" role="status"></p><div class="actions"><button id="feedback-save">保存处理结果</button><button id="feedback-delete" type="button" style="color:#ac4355">删除反馈</button><button id="feedback-close" type="button" class="secondary">关闭</button></div></form></dialog></div></section></div>
<dialog id="reset"><h2>重置用户密码</h2><p id="target"></p><p>重置后，该用户现有登录会话将失效，需要用新密码登录。</p><form id="reset-form"><label>新密码<input id="new-password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><label>再次输入<input id="confirm-password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><div class="actions"><button>确认重置</button><button id="cancel" type="button">取消</button></div></form></dialog>
</main><script src="/admin/app.js"></script><script src="/admin/feedback.js"></script><script src="/admin/campaigns.js"></script><script src="/admin/campaign-media.js"></script></body></html>
