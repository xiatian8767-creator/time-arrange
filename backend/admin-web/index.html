<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Orbit · 运营管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#26324b;font:15px system-ui,sans-serif}main{max-width:1050px;margin:40px auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}h1{font-size:26px}small,p{color:#6b7892}section{background:white;padding:24px;border-radius:20px;margin:16px 0;box-shadow:0 8px 30px #26324b08}#login{max-width:420px;margin:70px auto}label{display:block;margin:15px 0}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #d9dfec}input{width:100%;margin-top:8px}button{cursor:pointer;background:#596fd5;color:#fff;border:0}button:disabled{opacity:.5}form.search{display:flex;gap:12px;align-items:end}form.search input{flex:1}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:15px 10px;border-bottom:1px solid #edf0f5;word-break:break-word}.table{overflow:auto}#notice{min-height:24px;color:#aa3657}dialog{border:0;border-radius:20px;max-width:440px;width:90%;padding:25px}dialog::backdrop{background:#18254066}.actions{display:flex;gap:12px;margin-top:20px}[hidden]{display:none!important}</style></head><body><main><header><div><h1>✦ Star Orbit</h1><small>运营管理 · 用户查询与密码重置</small></div><button id="logout" hidden>退出登录</button></header><p id="notice" role="status"></p><section id="login"><h2>管理员登录</h2><form id="login-form"><label>用户名<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button>登录</button></form></section><section id="dashboard" hidden><form id="search" class="search"><input id="query" placeholder="搜索用户名、昵称或用户 ID" maxlength="80" aria-label="搜索用户"><button>查询</button></form><div class="table"><table><thead><tr><th>用户名</th><th>昵称</th><th>用户 ID</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button id="prev">上一页</button><button id="next">下一页</button></div></section><dialog id="reset"><h2>重置用户密码</h2><p id="target"></p><p>重置后，该用户现有登录会话将失效，需要用新密码登录。</p><form id="reset-form"><label>新密码<input id="new-password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><label>再次输入<input id="confirm-password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><div class="actions"><button>确认重置</button><button id="cancel" type="button">取消</button></div></form></dialog></main><script src="/admin/app.js"></script></body></html>
