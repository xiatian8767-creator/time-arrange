services:
  web:
    build:
      context: .
    image: xingke-download:3.4beta.3
    container_name: xingke-download
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /opt/xingke-v2/backend/acme-http-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/xingke-acme/webroot:/var/www/acme:ro
