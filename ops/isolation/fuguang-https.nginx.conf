server {
    listen 8443 ssl;
    server_name fuguang.startimetable.xyz;
    ssl_certificate /etc/letsencrypt/live/fuguang.startimetable.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fuguang.startimetable.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $fuguang_upstream fuguang-backend:8000;
        proxy_pass http://$fuguang_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
