# HTTPS IP testing with a private CA imported explicitly into Bruno.
# Start: docker compose -f compose.v2.yaml -f compose.v2.ip-test.yaml up -d ip-test-proxy
# Close: docker compose -f compose.v2.yaml -f compose.v2.ip-test.yaml stop ip-test-proxy
services:
  ip-test-proxy:
    image: xingke-download:1.2.5
    restart: unless-stopped
    ports:
      - "0.0.0.0:443:8443"
    volumes:
      - ./backend/ip-test-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-test/server.crt:/etc/xingke-tls/server.crt:ro
      - ./tls-test/server.key:/etc/xingke-tls/server.key:ro
      - /opt/fuguang/deploy/https.nginx.conf:/etc/nginx/conf.d/fuguang.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks: [starorbit-ingress, fuguang-ingress]
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null --no-check-certificate https://127.0.0.1:8443/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
networks:
  fuguang-ingress:
    external: true
    name: fuguang_ingress
